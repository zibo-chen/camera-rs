[package]
name = "camera-android"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-*"]
description = "Android USB permission and JNI adapter for camera"
[workspace]
[lib]
crate-type = ["rlib", "cdylib", "staticlib"]
[dependencies]
camera = { path = "..", version = "0.4.0", default-features = false, features = ["runtime-tokio"] }
jni = "0.21"
log = "0.4"
libc = "0.2"
thiserror = "1.0"
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[features]
default = ["camera2"]
camera2 = ["camera/backend-camera2"]
uvc = ["camera/backend-uvc"]
v4l2 = ["camera/backend-v4l2"]
convert-rgb = ["camera/convert-rgb"]
decode-mjpeg = ["camera/decode-mjpeg", "convert-rgb"]
