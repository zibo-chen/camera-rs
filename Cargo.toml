[package]
name = "camera-rs"
version = "0.5.0"
edition = "2021"
authors = ["ChenZibo <qw.54@163.com>"]
description = "Intent-driven cross-platform camera capture with bounded native frames"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/camera-rs"
homepage = "https://github.com/zibo-chen/camera-rs"
repository = "https://github.com/zibo-chen/camera-rs"
include = ["/src/**", "/Cargo.toml", "/build.rs", "/README.md", "/BUILD.md", "/CONTRIBUTING.md", "/SECURITY.md", "/CODE_OF_CONDUCT.md", "/docs/ARCHITECTURE.md", "/LICENSE-*", "/THIRD_PARTY.md", "/VENDORING.md", "/cpp/**", "/cmake/**", "/examples/**", "/benches/**", "/tests/**", "/scripts/**", "/docs/API.md", "/docs/V4L2.md", "/3rdparty/libuvc/src/**", "/3rdparty/libuvc/include/**", "/3rdparty/libuvc/LICENSE.txt", "/3rdparty/libusb/libusb/**", "/3rdparty/libusb/COPYING", "/3rdparty/libusb/android/**"]
keywords = ["camera", "uvc", "video", "usb"]
categories = ["multimedia::video", "hardware-support"]

[dependencies]
# Core dependencies.
libc = "0.2"
thiserror = "1.0"
log = "0.4"

# High-performance synchronization.
parking_lot = "0.12"

# Async support.
tokio = { version = "1.0", features = ["sync", "time", "rt", "macros"], optional = true }

# Data processing.
ndarray = { version = "0.16", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }

# JPEG decoding for UVC, Media Foundation, and V4L2 MJPEG paths.
turbojpeg = { version = "1.3", optional = true }

# Windows Media Foundation support.
[target.'cfg(target_os = "windows")'.dependencies]
windows-core = { version = "0.58", optional = true }
windows = { version = "0.58", optional = true, features = [
    "implement",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Media_MediaFoundation",
    "Win32_Media_DirectShow",
    "Win32_Media_KernelStreaming",
] }
once_cell = { version = "1.19", optional = true }

# macOS/iOS AVFoundation support.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { version = "0.6", optional = true, features = ["exception"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "NSArray",
    "NSString",
    "NSObject",
    "NSError",
    "NSException",
    "NSObjCRuntime",
    "NSDictionary",
    "NSValue",
    "NSNotification",
    "objc2-core-foundation",
] }
objc2-av-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureOutput",
    "AVCaptureOutputBase",
    "AVCaptureSession",
    "AVCaptureSessionPreset",
    "AVCaptureVideoDataOutput",
    "AVMediaFormat",
    "block2",
    "dispatch2",
    "objc2-core-media",
    "objc2-core-video",
] }
objc2-core-media = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "CMFormatDescription",
    "CMSampleBuffer",
    "CMBlockBuffer",
    "CMTime",
    "objc2",
    "objc2-core-video",
] }
objc2-core-video = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
    "objc2",
] }
block2 = { version = "0.6", optional = true }
dispatch2 = { version = "0.3", optional = true, features = ["std", "block2", "objc2"] }

[build-dependencies]
cc = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
serde_json = "1"



[[example]]
name = "hotplug_monitor"

[[example]]
name = "probe_formats"

[[example]]
name = "resilient_camera"

# Benchmark configurations
[[bench]]
name = "color_convert"
harness = false

[lib]
name = "camera"
crate-type = ["lib"]

[workspace]
members = ["camera-android"]
default-members = ["."]
resolver = "2"

[features]
ndarray = ["runtime-tokio", "dep:ndarray"]
# Convenience bundle. Features decide what is compiled; BackendPolicy decides runtime behavior.
default = ["native", "runtime-tokio"]
native = ["backend-v4l2", "backend-avfoundation", "backend-camera2", "backend-mf"]
runtime-tokio = ["dep:tokio"]
blocking = ["runtime-tokio", "tokio/rt-multi-thread"]
convert-rgb = []
decode-mjpeg = ["dep:turbojpeg", "convert-rgb"]
serde = ["dep:serde"]

# Backend selection.
backend-uvc = ["runtime-tokio"] # UVC through libuvc for cross-platform USB cameras.
backend-v4l2 = ["runtime-tokio"] # Linux kernel V4L2 with MMAP and no libuvc dependency.
backend-avfoundation = ["runtime-tokio", "apple"] # AVFoundation - macOS/iOS
backend-camera2 = ["runtime-tokio"]      # Camera2 - Android (NDK, no JNI required)
native-debug-logs = []    # Verbose libusb diagnostics; keep disabled for capture benchmarks.
benchmark-internals = ["runtime-tokio", "convert-rgb"]  # Exposes the frame publisher only to the repository benchmark.
custom-backend = ["runtime-tokio"] # Experimental application-provided backend API.
backend-mf = ["runtime-tokio", "windows-native"] # Media Foundation - Windows

apple = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-av-foundation", "dep:objc2-core-media", "dep:objc2-core-video", "dep:block2", "dep:dispatch2"]
windows-native = ["dep:windows", "dep:windows-core", "dep:once_cell"]

[package.metadata.docs.rs]
features = [
    "runtime-tokio",
    "blocking",
    "convert-rgb",
    "decode-mjpeg",
    "serde",
    "ndarray",
    "custom-backend",
]
rustdoc-args = ["--cfg", "docsrs"]
